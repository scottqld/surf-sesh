# SurfSesh front nginx: serves the PWA at /surf-sesh/ and proxies /api/ to the
# API container. tailscale serve terminates TLS and forwards here.
server {
  listen 80;
  server_name _;

  # Static PWA lives at html/surf-sesh/ (mounted). root + subdir avoids the
  # alias+try_files quirks.
  root /usr/share/nginx/html;
  index index.html;   # custom default.conf drops nginx's default; without it a
                      # directory request (/surf-sesh/) 403s instead of serving index.html

  location = / { return 302 /surf-sesh/; }

  location /surf-sesh/ {
    try_files $uri $uri/ /surf-sesh/index.html;
    # sw.js and index must always revalidate so cutover/version changes land.
    location ~* \.(?:html|js|json)$ { add_header Cache-Control "no-cache"; }
  }

  # /api/ -> API (trailing slash strips the /api prefix). Same origin as the
  # PWA, so no CORS needed; the API sends permissive CORS anyway.
  location /api/ {
    proxy_pass http://surfsesh-api:8098/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }
}
