# Main nginx config for surfsesh-web. On this NAS the stock nginx:alpine workers
# (user "nginx", uid 101) are denied reading the bind-mounted app files, so we
# run workers as root — the same pattern the other static apps here use
# (looptimer, web, nas-dashboard). default.conf (the server block) is included
# from conf.d.
user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  include /etc/nginx/conf.d/*.conf;
}
