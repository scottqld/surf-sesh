name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Cloudflare Worker
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy
        working-directory: worker
        run: |
          # Cloudflare API tokens are [A-Za-z0-9_-]; strip any BOM / whitespace
          # / newline the secret may have been saved with (cause of the 9109
          # "Invalid access token" error). Report the cleaned length only — never
          # the value — so we can tell a corrupted secret from an expired one.
          CLEAN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -cd 'A-Za-z0-9_-')
          echo "token length: raw=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | wc -c) cleaned=${#CLEAN}"
          CLOUDFLARE_API_TOKEN="$CLEAN" npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # wrangler 4.86.0 telemetry throws a BOM ByteString error in CI;
          # disabling it is the same fix that works locally.
          WRANGLER_SEND_METRICS: "false"
